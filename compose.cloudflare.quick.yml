services:
  # Keep a stable internal origin for the temporary public Quick Tunnel while
  # the frontend container is rebuilt or recreated.
  review-gateway:
    image: caddy:2-alpine
    container_name: fyuri_review_gateway
    restart: unless-stopped
    volumes:
      - ./Caddyfile.quick:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
    networks:
      - fyuri_network

  # Quick Tunnels are for temporary review only. Their random hostname can
  # change after recreation and Cloudflare provides no uptime guarantee.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: fyuri_cloudflared_quick
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://review-gateway:8080
    depends_on:
      - review-gateway
    networks:
      - fyuri_network
