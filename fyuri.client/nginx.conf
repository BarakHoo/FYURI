server {
	listen 80;
	server_name localhost;
	root /usr/share/nginx/html;
	index index.html;

	# Allow image uploads up to 6MB (backend enforces 5MB)
	client_max_body_size 6m;

	# Security headers
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

	# Serve crawler files directly (never fall back to index.html)
	location = /robots.txt {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=86400";
	}

	location = /sitemap.xml {
		types { } default_type application/xml;
		try_files $uri =404;
		add_header Cache-Control "public, max-age=86400";
	}

	# SPA routing - serve index.html for all routes
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Proxy API requests to backend
	location /api/ {
		proxy_pass http://backend:8080/api/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_cache_bypass $http_upgrade;
	}

	# Serve images from backend
	location /images/ {
		proxy_pass http://backend:8080/images/;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_cache_valid 200 1d;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
	}

	# Cache static assets
	location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
	}
}
