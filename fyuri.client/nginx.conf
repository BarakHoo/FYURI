map $http_x_forwarded_proto $fyuri_forwarded_proto {
	default $http_x_forwarded_proto;
	"" $scheme;
}

map $http_x_forwarded_for $fyuri_forwarded_client {
	default $http_x_forwarded_for;
	"" $remote_addr;
}

map $http_cf_connecting_ip $fyuri_client_ip {
	default $http_cf_connecting_ip;
	"" $fyuri_forwarded_client;
}

server {
	listen 80;
	server_name localhost;
	root /usr/share/nginx/html;
	index index.html;

	# Allow image uploads up to 6MB (backend enforces 5MB)
	client_max_body_size 6m;

	# Security headers
	add_header X-Content-Type-Options "nosniff" always;
	add_header X-Frame-Options "SAMEORIGIN" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	# Gzip compression
	gzip on;
	gzip_vary on;
	gzip_min_length 1024;
	gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

	# SPA routing - serve index.html for all routes
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Proxy API requests to backend
	location /api/ {
		proxy_pass http://backend:8080/api/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $fyuri_client_ip;
		proxy_set_header X-Forwarded-For $fyuri_client_ip;
		proxy_set_header X-Forwarded-Proto $fyuri_forwarded_proto;
		proxy_cache_bypass $http_upgrade;
	}

	# Prefer versioned assets baked into the frontend image, including the hero
	# poster. Fall through to the backend volume for administrator uploads.
	location ^~ /images/ {
		try_files $uri @backend_images;
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
	}

	location @backend_images {
		proxy_pass http://backend:8080;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_cache_valid 200 1d;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
	}

	# Cache static assets
	location ~* \.(js|css|png|jpg|jpeg|gif|webp|ico|svg|woff|woff2|ttf|eot|mp4|webm|glb)$ {
		expires 1y;
		add_header Cache-Control "public, immutable";
		add_header X-Content-Type-Options "nosniff" always;
	}
}
