# Static side-projects deployed alongside FYURI on munkys.dev.
#
# Each project is its own GitHub repo, cloned as a SIBLING folder next to the
# FYURI repo on the server, e.g.:
#   ~/apps/FYURI                     (this repo, runs docker-compose.yml)
#   ~/apps/calc3d-print-calculator
#   ~/apps/face-detection
#   ~/apps/location-reminders
#   ~/apps/shopping-list
#   ~/apps/face-mesh-explorer
#
# These containers attach to the SAME network as the FYURI Caddy so it can
# reverse_proxy to them by service name (see Caddyfile subpath blocks).
#
# Bring up FYURI first (docker compose -f docker-compose.yml up -d), then:
#   docker compose -f docker-compose.projects.yml up -d --build

services:
  calc3d:
    build:
      context: ../calc3d-print-calculator
    container_name: proj_calc3d
    restart: unless-stopped
    networks:
      - fyuri_network

  face:
    build:
      context: ../face-detection
    container_name: proj_face
    restart: unless-stopped
    networks:
      - fyuri_network

  gps-reminder:
    build:
      context: ../location-reminders
    container_name: proj_gps_reminder
    restart: unless-stopped
    networks:
      - fyuri_network

  shopping-list:
    build:
      context: ../shopping-list
    container_name: proj_shopping_list
    restart: unless-stopped
    networks:
      - fyuri_network

  face-mesh:
    build:
      context: ../face-mesh-explorer
    container_name: proj_face_mesh
    restart: unless-stopped
    networks:
      - fyuri_network

# Attach to the network created by the main FYURI compose stack.
# Docker Compose prefixes network names with the project (folder) name, so the
# FYURI stack's "fyuri_network" becomes "fyuri_fyuri_network" by default.
# Adjust the external name below if your FYURI folder differs.
networks:
  fyuri_network:
    external: true
    name: fyuri_fyuri_network
